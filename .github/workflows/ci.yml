name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${ matrix.os }/ node ${ matrix.node })
    runs-on: ${ matrix.os }
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${ matrix.node }

      - name: Install (no lifecycle scripts)
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
        shell: bash

      - name: 工程门禁（G90–G92，scripts/check-spec.mjs）
        run: npm run check

      - name: 扫描式测试链（scripts/run-tests.mjs）
        run: npm test

      - name: 定点破坏有效性自检（scripts/verify-effectiveness.mjs，I-10–I-16）
        run: npm run test:effectiveness -- --strict

      - name: S5 部署接缝（Windows）
        if: runner.os == 'Windows'
        run: npm run test:seam:s5

      - name: S5 部署接缝（Ubuntu 跳过并打印原因）
        if: runner.os != 'Windows'
        run: |
          echo "SKIP: S5 部署契约需要 Windows PowerShell 5.1 与 .cmd shim。"
          echo "SKIP: 原因：Ubuntu 上没有 profile 的 cordis.patch.yml 与 junction 语义，部署接缝只能在 Windows 验证。"
          echo "SKIP: 其余接缝（S1/S2/S3/S4）已在上一步 npm test 中执行。"
        shell: bash

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${ matrix.os }-node${ matrix.node }
          path: |
            test-report.json
            effectiveness-report.json
          if-no-files-found: ignore
